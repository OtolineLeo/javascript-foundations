<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHAT DA FOCK</title>
</head>
<body>
    
    <script>
        const nome = prompt("Digite seu nome: ");
        console.log(nome);
        document.body.innerHTML = `Seu nome é: <strong>${nome}</strong> <br />`;
        document.body.innerHTML += `Seu nome tem: <strong>${nome.length}</strong> letras <br />`;
        document.body.innerHTML += `A segunda letra do seu nome é: <strong>${nome.charAt(1)}</strong> <br />`;
        document.body.innerHTML += `Qual o primero indice da letra A no seu nome? <strong>${nome.indexOf('a')}</strong> <br />`;
        document.body.innerHTML += `Qual o ultimo indice da letra A no seu nome? <strong>${nome.lastIndexOf('a')}</strong> <br />`;
        document.body.innerHTML += `As ultimas tres letras do seu nome são: <strong>${nome.slice(-3)}</strong> <br />`;
        document.body.innerHTML += `As palavras do seu nome são: ${nome.split(' ')} <br />`;
        document.body.innerHTML += `Seu nome em letras maiuscula é: <strong>${nome.toUpperCase()}</strong> <br />`;
        document.body.innerHTML += `Seu nome em letras minuscula é: <strong>${nome.toLowerCase()}</strong> <br />`; 

    </script>

</body>
</html>
